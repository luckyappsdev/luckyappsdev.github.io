 lembretes após a reinicialização do dispositivo e trabalhar em segundo plano. Não solicita acesso a contatos, câmera, microfone, localização nem Internet."], ["Backups", "O arquivo de backup é criado pelo próprio usuário e salvo na pasta que ele escolher; o autor não tem acesso a ele. O backup do sistema Android está desativado para o aplicativo, portanto os dados dele não são copiados automaticamente para uma conta Google."], ["Alterações", "Se uma função na nuvem for adicionada no futuro, esta política será atualizada e os usuários serão avisados."], ["Contato", "Dúvidas e sugestões: "]]}, "nl": {"name": "Nederlands", "title": "Privacybeleid", "back": "← Home", "upd": "Laatst bijgewerkt: oktober 2026", "s": [["Gegevens", "De app verzamelt, verzendt of verwerkt geen persoonsgegevens van gebruikers. Gegevens over voertuigen, kilometerstand en onderhoud worden alleen op het apparaat van de gebruiker opgeslagen, in het interne geheugen van de app waar andere apps geen toegang toe hebben."], ["Internet en derden", "De app vraagt geen internetmachtiging aan en kan daarom zelf geen gegevens via het netwerk versturen. De app bevat geen advertenties, analysetools of modules van derden voor gegevensverzameling, stuurt geen gegevens naar eigen servers en deelt geen informatie met derden. Sommige schermen (zoals de PayPal-link of het openen van een geïnstalleerde cryptowallet) openen andere apps of de browser op initiatief van de gebruiker zelf. Dat is een standaardactie van Android en geen gegevensoverdracht door de app."], ["Machtigingen", "De app gebruikt machtigingen alleen voor de herinneringen: meldingen tonen, op het exacte tijdstip afgaan, herinneringen herstellen na het herstarten van het apparaat en op de achtergrond werken. De app vraagt geen toegang tot contacten, camera, microfoon, locatie of internet."], ["Back-ups", "Het back-upbestand wordt door de gebruiker zelf gemaakt en opgeslagen in een door de gebruiker gekozen map; de maker heeft er geen toegang toe. De systeemback-up van Android is voor de app uitgeschakeld, dus de gegevens worden niet automatisch naar een Google-account gekopieerd."], ["Wijzigingen", "Als er in de toekomst een cloudfunctie wordt toegevoegd, wordt dit beleid bijgewerkt en worden gebruikers hiervan op de hoogte gesteld."], ["Contact", "Vragen en suggesties: "]]}, "zh": {"name": "中文", "title": "隐私政策", "back": "← 返回首页", "upd": "最后更新：2026 年 10 月", "s": [["数据", "本应用不会收集、传输或处理用户的任何个人数据。车辆、里程和保养数据仅存储在用户设备上，位于应用的内部存储中，其他应用无法访问。"], ["互联网与第三方", "本应用不申请互联网权限，因此自身无法通过网络发送数据。应用不含广告、统计分析或第三方数据收集组件，不会向任何自有服务器发送数据，也不会与第三方共享信息。部分界面（例如 PayPal 链接或打开已安装的加密货币钱包）会在用户主动操作时打开其他应用或浏览器，这是 Android 的标准行为，并非应用传输数据。"], ["权限", "应用仅为提醒功能使用权限：显示通知、准时触发、设备重启后恢复提醒以及后台运行。应用不会申请通讯录、相机、麦克风、位置或互联网访问权限。"], ["备份", "备份文件由用户自行创建，并保存到用户选择的文件夹，作者无法访问。本应用已关闭 Android 系统备份，因此应用数据不会自动备份到 Google 账号。"], ["变更", "如果将来添加云端功能，本政策将会更新，并通知用户。"], ["联系方式", "问题与建议："]]}};
