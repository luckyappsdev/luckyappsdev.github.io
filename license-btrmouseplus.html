r 2026", "s": [["Definitions", "BTRMousePlus is distributed in two forms: an installer and a ZIP archive with identical contents. \"Use of the program\" means downloading it, installing it or unpacking the archive, running it and working with it."], ["Use", "The program is provided free of charge for personal use, including on the user's own work computer. By using the program you accept these terms; if you do not agree with them, do not use the program."], ["Voluntary use", "Any use of the program is entirely the user's own voluntary decision. The user decides whether the program is suitable and accepts the risks associated with using it."], ["No warranty", "The program is provided \"as is\", without any warranty, including that it will work with specific device models. To the maximum extent permitted by law, the author is not liable for any direct or indirect damage, loss of data or other consequences of using the program."], ["Distribution", "The author distributes the program through the website luckyappsdev.github.io and its GitHub releases page. The author does not control copies of the program on other websites or obtained in other ways and is not responsible for their content or safety. We recommend downloading the program from the author's website and checking the file before using it."], ["Restrictions", "Decompiling, disassembling, reverse engineering and modifying the program's executable files are prohibited. Replacing the sound files in the Assets\\Sounds folder is provided for by the program and is not prohibited."], ["Third-party components", "The program uses the NAudio library (MIT license); details are given in the file ThirdPartyNotices.txt included in the archive and the installer."], ["Contact", "Questions and feedback: "]]}};
var MAIL = "luckyapps1975@gmail.com";
var order = ["en","ru"];
var cur = "en";
try { var s = localStorage.getItem("plang"); if (s && L[s]) cur = s; else { var n = (navigator.language || "").slice(0,2); if (L[n]) cur = n; else if (/^(ru|uk|be)$/.test(n)) cur = "ru"; } } catch (e) {}
function render() {
  var t = L[cur];
  document.documentElement.lang = cur;
  document.getElementById("back").textContent = t.back;
  document.getElementById("title").textContent = t.title;
  document.getElementById("upd").textContent = t.upd;
  var lb = document.getElementById("langs"); lb.innerHTML = "";
  order.forEach(function (k) {
    var b = document.createElement("button"); b.type = "button"; b.textContent = L[k].name;
    b.setAttribute("aria-pressed", k === cur);
    b.onclick = function () { cur = k; try { localStorage.setItem("plang", k); } catch (e) {} render(); };
    lb.appendChild(b);
  });
  var c = document.getElementById("card"); c.innerHTML = "";
  t.s.forEach(function (sec, i) {
    var h = document.createElement("h2"); h.textContent = sec[0]; c.appendChild(h);
    var p = document.createElement("p"); p.textContent = sec[1];
    if (i === t.s.length - 1) { var a = document.createElement("a"); a.href = "mailto:" + MAIL; a.textContent = MAIL; p.appendChild(a); }
    c.appendChild(p);
  });
}
render();
