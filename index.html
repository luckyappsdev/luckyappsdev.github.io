<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lucky Apps</title>
<meta name="description" content="Android and Windows apps by Lucky Apps. Приложения для Android и Windows от Lucky Apps.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f7f2;--card:#fff;--ink:#12352a;--muted:#5b7267;--green:#2f9e5b;--gold:#e8b923;--line:#d7e3da}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,Arial,sans-serif;line-height:1.55}
.wrap{max-width:960px;margin:0 auto;padding:24px 20px 48px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px}
.logo{font-family:Unbounded,Manrope,sans-serif;font-weight:700;font-size:1.15rem}
.logo span{color:var(--green)}
.lang{display:flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden}
.lang button{border:0;background:none;padding:6px 14px;font:inherit;font-weight:800;color:var(--ink);cursor:pointer}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.hero{padding:56px 0 36px}
h1{font-family:Unbounded,Manrope,sans-serif;font-weight:700;font-size:clamp(1.9rem,5vw,3rem);line-height:1.15;margin:0 0 14px;max-width:16em}
.hero p{font-size:1.1rem;color:var(--muted);max-width:34em;margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:22px}
.app{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:24px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;gap:14px;align-items:center}
.icon{width:64px;height:64px;border-radius:16px;background:var(--green);color:#fff;display:grid;place-items:center;font-family:Unbounded,sans-serif;font-size:1.6rem;flex:none}
.app:nth-child(2) .icon{background:var(--gold);color:var(--ink)}
h2{font-family:Unbounded,Manrope,sans-serif;font-weight:500;font-size:1.2rem;margin:0}
.tag{display:inline-block;font-size:.8rem;font-weight:800;background:#e7f3ea;color:var(--green);border-radius:8px;padding:1px 8px;margin-top:4px}
.tag.plat{background:#e8eef0;color:var(--ink)}
.tag.beta{background:#fdf3d0;color:#8a6a00}
.desc{margin:0;color:var(--muted)}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-weight:600}
.stars button{border:0;background:none;padding:0 1px;font-size:1.5rem;color:#c9d6cd;cursor:pointer}
.stars button.on{color:var(--gold)}
.dl{display:block;text-align:center;text-decoration:none;background:var(--ink);color:#fff;font-weight:800;padding:13px 18px;border-radius:14px;border:0;font-size:1rem;font-family:inherit;cursor:pointer}
.dl:hover{background:var(--green)}
.dl[aria-disabled=true]{background:#c9d6cd;color:#5b7267;pointer-events:none}
.hint{font-size:.88rem;color:var(--muted);margin:0}
button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
footer{margin-top:44px;color:var(--muted);font-size:.9rem;border-top:1px solid var(--line);padding-top:18px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">Lucky<span>Apps</span></div>
    <div class="lang" role="group" aria-label="Language">
      <button data-l="ru" aria-pressed="true">RU</button>
      <button data-l="en" aria-pressed="false">EN</button>
    </div>
  </header>

  <section class="hero">
    <h1 data-t="h1"></h1>
    <p data-t="sub"></p>
  </section>

  <main class="grid" id="apps"></main>

  <footer data-t="foot"></footer>
</div>

<script>
/* ===== ЗДЕСЬ МЕНЯЕТСЯ СОДЕРЖИМОЕ САЙТА ===== */
var APPS = [
  {
    id: "app1",
    letter: "1",
    platform: "android", /* android или windows */
    status: "ready", /* ready = готово, beta = в разработке */
    file: "", /* сюда вставляется ссылка на .apk (см. инструкцию) */
    name: { ru: "Первое приложение", en: "First app" },
    desc: {
      ru: "Здесь будет короткое описание: что делает приложение и чем оно полезно.",
      en: "A short description goes here: what the app does and why it is useful."
    }
  },
  {
    id: "app2",
    letter: "2",
    platform: "windows",
    status: "beta",
    file: "",
    name: { ru: "Второе приложение", en: "Second app" },
    desc: {
      ru: "Здесь будет описание второго приложения. Оно ещё дорабатывается.",
      en: "Description of the second app goes here. It is still being improved."
    }
  }
];

var TEXT = {
  ru: {
    h1: "Приложения для Android и Windows, которые просто работают",
    sub: "Бесплатно, без лишнего. Выберите приложение, скачайте файл и установите его на телефон или компьютер.",
    dl_android: "Скачать для Android", dl_windows: "Скачать для Windows", soon: "Скоро",
    downloads: "скачиваний", rate: "Оцените:", none: "нет оценок",
    ready: "Готово", beta: "Бета",
    hint_android: "Телефон может спросить разрешение на установку из этого источника. Это нормально: разрешите установку для вашего браузера.",
    hint_windows: "Windows может показать окно «Система Windows защитила ваш компьютер». Нажмите «Подробнее», затем «Выполнить в любом случае».",
    foot: "© Lucky Apps. Все права защищены."
  },
  en: {
    h1: "Android and Windows apps that simply work",
    sub: "Free and no fuss. Pick an app, download the file and install it on your phone or computer.",
    dl_android: "Download for Android", dl_windows: "Download for Windows", soon: "Coming soon",
    downloads: "downloads", rate: "Rate it:", none: "no ratings yet",
    ready: "Ready", beta: "Beta",
    hint_android: "Your phone may ask to allow installs from this source. That is normal: allow it for your browser.",
    hint_windows: "Windows may show a \"Windows protected your PC\" window. Click \"More info\", then \"Run anyway\".",
    foot: "© Lucky Apps. All rights reserved."
  }
};

/* Пока это пробные данные внутри страницы.
   Следующим шагом заменим на настоящее хранилище (Supabase). */
var STATS = { app1: { downloads: 0, sum: 0, votes: 0 }, app2: { downloads: 0, sum: 0, votes: 0 } };

var lang = "ru";
try { var s = localStorage.getItem("lang"); if (s) lang = s; else if (!/^ru|uk|be/.test(navigator.language || "")) lang = "en"; } catch (e) {}

function render() {
  var T = TEXT[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(function (el) { el.textContent = T[el.dataset.t]; });
  document.querySelectorAll(".lang button").forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.l === lang); });

  var box = document.getElementById("apps");
  box.innerHTML = "";
  APPS.forEach(function (a) {
    var st = STATS[a.id], avg = st.votes ? (st.sum / st.votes).toFixed(1) : null;
    var card = document.createElement("article");
    card.className = "app";
    var stars = "";
    for (var i = 1; i <= 5; i++) stars += '<button type="button" data-a="' + a.id + '" data-s="' + i + '" class="' + (avg && i <= Math.round(avg) ? "on" : "") + '" aria-label="' + i + '">★</button>';
    card.innerHTML =
      '<div class="top"><div class="icon">' + a.letter + '</div><div><h2></h2><span class="tag plat">' + a.platform.charAt(0).toUpperCase() + a.platform.slice(1) + '</span> <span class="tag ' + a.status + '">' + T[a.status] + '</span></div></div>' +
      '<p class="desc"></p>' +
      '<div class="meta"><span>' + st.downloads + ' ' + T.downloads + '</span><span>' + (avg ? "★ " + avg + " (" + st.votes + ")" : T.none) + '</span></div>' +
      '<div class="stars"><span>' + T.rate + '</span> ' + stars + '</div>' +
      '<a class="dl" data-a="' + a.id + '" ' + (a.file ? 'href="' + a.file + '"' : 'aria-disabled="true"') + '>' + (a.file ? T['dl_' + a.platform] : T.soon) + '</a>' +
      '<p class="hint">' + T['hint_' + a.platform] + '</p>';
    card.querySelector("h2").textContent = a.name[lang];
    card.querySelector(".desc").textContent = a.desc[lang];
    box.appendChild(card);
  });
}

document.addEventListener("click", function (e) {
  var b = e.target.closest("button[data-l]");
  if (b) { lang = b.dataset.l; try { localStorage.setItem("lang", lang); } catch (x) {} render(); return; }
  var s = e.target.closest("button[data-s]");
  if (s) { var st = STATS[s.dataset.a]; st.sum += +s.dataset.s; st.votes++; render(); return; }
  var d = e.target.closest("a.dl[href]");
  if (d) { STATS[d.dataset.a].downloads++; setTimeout(render, 300); }
});

render();
</script>
</body>
</html>
